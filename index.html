<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Animador Web</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #111827;
  color: white;
}

header {
  padding: 16px;
  text-align: center;
  background: #1f2937;
  font-size: 22px;
  font-weight: bold;
}

.container {
  max-width: 900px;
  margin: auto;
  padding: 20px;
}

.preview {
  position: relative;
  width: 100%;
  aspect-ratio: 16 / 9;
  overflow: hidden;
  border-radius: 15px;
  background: linear-gradient(
    #60a5fa 0%,
    #60a5fa 65%,
    #65a30d 65%,
    #65a30d 100%
  );
}

.sun {
  position: absolute;
  top: 25px;
  right: 40px;
  font-size: 55px;
}

.house {
  position: absolute;
  bottom: 14%;
  left: 40%;
  font-size: 100px;
}

.tree {
  position: absolute;
  bottom: 14%;
  right: 10%;
  font-size: 85px;
}

.character {
  position: absolute;
  bottom: 14%;
  left: 15%;
  font-size: 85px;
  transition: left 0.4s ease;
}

.dialogue {
  position: absolute;
  bottom: 5%;
  left: 50%;
  transform: translateX(-50%);
  width: 70%;
  padding: 12px;
  background: white;
  color: #111827;
  border-radius: 14px;
  text-align: center;
  font-weight: bold;
}

.controls {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  justify-content: center;
  margin: 20px 0;
}

button {
  border: 0;
  padding: 12px 16px;
  border-radius: 8px;
  background: #2563eb;
  color: white;
  font-size: 15px;
  cursor: pointer;
}

button:hover {
  background: #1d4ed8;
}

.panel {
  background: #1f2937;
  padding: 20px;
  border-radius: 12px;
}

label {
  display: block;
  margin: 15px 0 6px;
}

textarea,
select {
  width: 100%;
  padding: 10px;
  border-radius: 8px;
  border: 1px solid #475569;
  background: #111827;
  color: white;
}

.characters {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
}

.characterButton {
  font-size: 28px;
  background: #374151;
}

.status {
  text-align: center;
  margin-top: 15px;
  color: #86efac;
}
</style>
</head>

<body>

<header>
🎬 Animador Web
</header>

<div class="container">

  <div class="preview" id="preview">

    <div class="sun">☀️</div>

    <div class="house">🏠</div>

    <div class="tree">🌳</div>

    <div class="character" id="character">
      👨
    </div>

    <div class="dialogue" id="dialogue">
      Olá! Bem-vindo ao meu vídeo!
    </div>

  </div>

  <div class="controls">

    <button onclick="moverEsquerda()">
      ⬅️ Esquerda
    </button>

    <button onclick="moverDireita()">
      ➡️ Direita
    </button>

    <button onclick="animar()">
      🎬 Animar
    </button>

    <button onclick="parar()">
      ⏹️ Parar
    </button>

  </div>

  <div class="panel">

    <h2>⚙️ Editor</h2>

    <label>Texto da fala</label>

    <textarea id="texto" oninput="mudarTexto()">Olá! Bem-vindo ao meu vídeo!</textarea>

    <label>Escolha um personagem</label>

    <div class="characters">

      <button class="characterButton" onclick="mudarPersonagem('👨')">👨</button>

      <button class="characterButton" onclick="mudarPersonagem('👩')">👩</button>

      <button class="characterButton" onclick="mudarPersonagem('🧒')">🧒</button>

      <button class="characterButton" onclick="mudarPersonagem('🐶')">🐶</button>

      <button class="characterButton" onclick="mudarPersonagem('🐱')">🐱</button>

    </div>

    <label>Cenário</label>

    <select id="cenario" onchange="mudarCenario()">

      <option value="casa">🏠 Casa</option>
      <option value="parque">🌳 Parque</option>
      <option value="cidade">🏙️ Cidade</option>
      <option value="espaco">🚀 Espaço</option>

    </select>

    <div class="status" id="status">
      ✅ Editor funcionando
    </div>

  </div>

</div>

<script>

let posicao = 15;
let animacao = null;

function mudarTexto() {

  const texto = document.getElementById("texto").value;

  document.getElementById("dialogue").textContent = texto;

}

function mudarPersonagem(personagem) {

  document.getElementById("character").textContent = personagem;

}

function moverEsquerda() {

  posicao -= 5;

  if (posicao < 0) {
    posicao = 0;
  }

  document.getElementById("character").style.left = posicao + "%";

}

function moverDireita() {

  posicao += 5;

  if (posicao > 85) {
    posicao = 85;
  }

  document.getElementById("character").style.left = posicao + "%";

}

function animar() {

  parar();

  animacao = setInterval(function() {

    posicao += 3;

    if (posicao > 85) {
      posicao = 0;
    }

    document.getElementById("character").style.left = posicao + "%";

  }, 200);

  document.getElementById("status").textContent =
    "▶️ Animação funcionando";

}

function parar() {

  if (animacao !== null) {
    clearInterval(animacao);
    animacao = null;
  }

  document.getElementById("status").textContent =
    "⏹️ Animação parada";

}

function mudarCenario() {

  const cenario = document.getElementById("cenario").value;
  const preview = document.getElementById("preview");

  if (cenario === "casa") {

    preview.style.background =
      "linear-gradient(#60a5fa 0%, #60a5fa 65%, #65a30d 65%, #65a30d 100%)";

  }

  if (cenario === "parque") {

    preview.style.background =
      "linear-gradient(#38bdf8 0%, #38bdf8 65%, #4d7c0f 65%, #4d7c0f 100%)";

  }

  if (cenario === "cidade") {

    preview.style.background =
      "linear-gradient(#64748b 0%, #64748b 65%, #334155 65%, #334155 100%)";

  }

  if (cenario === "espaco") {

    preview.style.background = "#020617";

  }

}

</script>

</body>
</html>
