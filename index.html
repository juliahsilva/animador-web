<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Animador Web V6.2 — Anime Studio</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#080c18;color:#fff;font-family:Arial,system-ui,sans-serif}
header{padding:16px;text-align:center;background:linear-gradient(135deg,#17244b,#314c96)}
h1{margin:0;font-size:22px}header p{margin:6px 0 0;color:#c4d0ed;font-size:12px}
main{max-width:1100px;margin:auto;padding:10px}.box{background:#11192c;border:1px solid #2d3e65;border-radius:15px;padding:12px;margin:10px 0}
textarea,input,select{width:100%;background:#080e1c;color:#fff;border:1px solid #35476c;border-radius:9px;padding:10px;font:inherit}
textarea{min-height:125px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
label{display:block;color:#aebddd;font-size:11px;margin:6px 0 4px}
button{border:0;border-radius:9px;padding:10px 13px;background:#3564e8;color:#fff;font-weight:bold;margin:3px}
.green{background:#159661}.purple{background:#7649e8}.red{background:#bd354b}.orange{background:#c67a20}.gray{background:#53617b}
canvas{width:100%;display:block;border:1px solid #42577f;border-radius:13px;background:#8fc9ed}
.timeline{display:flex;gap:7px;overflow:auto}.scene{min-width:155px;padding:8px;background:#090f1e;border:1px solid #304264;border-radius:10px}.scene.active{border-color:#82a8ff}
.scene b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.scene small{color:#9fb1d2}
.status{float:right;background:#233153;color:#bdd0ff;border-radius:20px;padding:4px 8px;font-size:11px}
.note{font-size:12px;color:#9eafd0;line-height:1.45}
#error{display:none;background:#421b25;color:#ffd6dc;padding:10px;border-radius:9px;margin-top:8px;font-size:12px;white-space:pre-wrap}
@media(max-width:720px){.grid{grid-template-columns:repeat(2,1fr)}h1{font-size:19px}}
</style>
</head>
<body>
<header><h1>🎬 Animador Web V6.2 — ANIME STUDIO</h1><p>Motor 2D • personagens • cenários • câmera • direção automática</p></header>
<main>
<div class="box">
<h3>🧠 História</h3>
<textarea id="story">Uma garota estava na cidade ao entardecer.
Ela caminhou até o parque.
No parque, encontrou um cachorro.
O cachorro correu até a garota.
A garota acenou para o cachorro.
Eles brincaram no parque.
Depois começou a chover.
A garota correu para casa.</textarea>
<button id="gen">✨ Gerar V6.2</button><button id="genplay" class="green">▶ Gerar e tocar</button><button id="demo" class="purple">🎞️ Demo cinematográfica</button>
<p class="note">V6.2 prioriza compatibilidade com celular: o desenho usa apenas recursos básicos do Canvas.</p><div id="error"></div>
</div>

<div class="box">
<b id="info">Cena 1</b><span id="status" class="status">PRONTO</span>
<canvas id="screen" width="960" height="540"></canvas>
<input id="scrub" type="range" min="0" max="1" step=".001" value="0">
<button id="play">▶ Tocar</button><button id="pause" class="gray">⏸ Pausar</button><button id="stop" class="red">⏹ Parar</button><button id="record" class="orange">🎥 Gravar</button>
</div>

<div class="box"><h3>🎞️ Linha do tempo</h3><div id="timeline" class="timeline"></div>
<button id="add" class="green">＋ Cena</button><button id="dup" class="gray">⧉ Duplicar</button><button id="del" class="red">🗑 Apagar</button></div>

<div class="box"><h3>🎨 Diretor</h3><div class="grid">
<div><label>Texto</label><input id="line"></div>
<div><label>Principal</label><select id="actor"></select></div>
<div><label>Segundo</label><select id="second"></select></div>
<div><label>Cenário</label><select id="bg"></select></div>
<div><label>Ação</label><select id="action"></select></div>
<div><label>Expressão</label><select id="mood"></select></div>
<div><label>Câmera</label><select id="camera"></select></div>
<div><label>Duração</label><input id="duration" type="number" min="1" max="30" step=".5"></div>
</div><button id="apply">Aplicar</button></div>

<div class="box"><h3>💾 Projeto</h3><button id="save">💾 Salvar</button><button id="load" class="gray">↻ Carregar</button><button id="json" class="purple">⬇ JSON</button></div>
</main>

<script>
(function(){
'use strict';
var $=function(id){return document.getElementById(id)}, canvas=$('screen'), ctx=canvas.getContext('2d');
var chars={
boy:{name:'Ren',type:'human',skin:'#d99a77',hair:'#20283b',shirt:'#477ee0',pants:'#26314d'},
girl:{name:'Mika',type:'human',skin:'#edaf8c',hair:'#522e54',shirt:'#e778a0',pants:'#51477e'},
man:{name:'Kai',type:'human',skin:'#c9896b',hair:'#1e2532',shirt:'#657084',pants:'#242a38'},
woman:{name:'Aya',type:'human',skin:'#e8a785',hair:'#623c2e',shirt:'#c96f88',pants:'#4d3d70'},
dog:{name:'Koro',type:'animal',fur:'#a96843'},cat:{name:'Yuki',type:'animal',fur:'#dfe4ec'},
fox:{name:'Aki',type:'animal',fur:'#d66d38'},wolf:{name:'Rin',type:'animal',fur:'#818c9e'},
robot:{name:'N-01',type:'robot'},alien:{name:'Luma',type:'alien'}
};
var bgs={home:'Casa',park:'Parque',city:'Cidade',school:'Escola',beach:'Praia',forest:'Floresta',mountain:'Montanha',night:'Noite',rain:'Chuva',sunset:'Pôr do sol',shrine:'Templo',space:'Espaço',cyber:'Cyberpunk',cafe:'Café',bedroom:'Quarto',festival:'Festival'};
var acts={idle:'Parado',walk:'Caminhar',run:'Correr',wave:'Acenar',jump:'Pular',talk:'Falar',dance:'Dançar',point:'Apontar',think:'Pensar'};
var moods={happy:'Feliz',neutral:'Neutro',surprised:'Surpreso',sad:'Triste',angry:'Bravo',love:'Carinhoso'};
var cams={wide:'Plano aberto',medium:'Plano médio',close:'Close',follow:'Acompanhar',zoom:'Zoom'};
var scenes=[],cur=0,playing=false,elapsed=0,last=0,raf=0;

function fill(id,obj,none){var s=$(id);s.innerHTML='';if(none){var n=document.createElement('option');n.value='none';n.textContent='Nenhum';s.appendChild(n)}for(var k in obj){var o=document.createElement('option');o.value=k;o.textContent=obj[k].name||obj[k];s.appendChild(o)}}
fill('actor',chars);fill('second',chars,true);fill('bg',bgs);fill('action',acts);fill('mood',moods);fill('camera',cams);

function err(e){$('error').style.display='block';$('error').textContent='Erro na V6.2:\\n'+(e&&e.message?e.message:e)}
window.onerror=function(m,u,l,c,e){err(e||new Error(m))};

function circle(px,py,r,col){ctx.fillStyle=col;ctx.beginPath();ctx.arc(px,py,r,0,Math.PI*2);ctx.fill()}
function ellipse(px,py,rx,ry,col){ctx.fillStyle=col;ctx.beginPath();ctx.ellipse(px,py,rx,ry,0,0,Math.PI*2);ctx.fill()}
function seg(a,b,col,w){ctx.strokeStyle=col;ctx.lineWidth=w;ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1]);ctx.stroke()}
function poly(p,col){ctx.fillStyle=col;ctx.beginPath();ctx.moveTo(p[0][0],p[0][1]);for(var i=1;i<p.length;i++)ctx.lineTo(p[i][0],p[i][1]);ctx.closePath();ctx.fill()}
function label(t,px,py,size,col,align){ctx.font='bold '+size+'px Arial';ctx.fillStyle=col||'#fff';ctx.textAlign=align||'left';ctx.fillText(t,px,py)}

function tree(px,py,s){ctx.fillStyle='#68442f';ctx.fillRect(px-8*s,py-65*s,16*s,65*s);circle(px,py-82*s,38*s,'#438e55');circle(px-27*s,py-62*s,27*s,'#51a05c');circle(px+27*s,py-62*s,27*s,'#4b9857')}
function background(type){
 var g=ctx.createLinearGradient(0,0,0,540);
 if(type==='night'){g.addColorStop(0,'#101a40');g.addColorStop(1,'#303754')}
 else if(type==='sunset'){g.addColorStop(0,'#ff987f');g.addColorStop(.55,'#f4c17b');g.addColorStop(1,'#7969a8')}
 else if(type==='rain'){g.addColorStop(0,'#687c9a');g.addColorStop(1,'#263449')}
 else if(type==='space'||type==='cyber'){g.addColorStop(0,'#090b20');g.addColorStop(1,'#242a60')}
 else {g.addColorStop(0,'#8eccef');g.addColorStop(1,'#e8f5fb')}
 ctx.fillStyle=g;ctx.fillRect(0,0,960,540);
 if(type==='space'){for(var i=0;i<80;i++){circle((i*137)%960,(i*71)%310,1.5,'#fff')}circle(800,90,42,'#ddddef');return}
 if(type==='night')circle(800,85,42,'#f3efcf');else if(type!=='cyber')circle(110,80,38,'#ffda5a');
 if(type==='cyber'){for(i=0;i<12;i++){var bx=i*82,h=100+(i*37)%180;ctx.fillStyle=i%2?'#18244d':'#202b59';ctx.fillRect(bx,390-h,68,h);ctx.fillStyle='#65dcff';ctx.fillRect(bx+12,360-h,8,6);ctx.fillStyle='#ff67cf';ctx.fillRect(bx+32,330-h,8,6)}ctx.fillStyle='#10162e';ctx.fillRect(0,390,960,150);return}
 if(type==='city'||type==='rain'||type==='cafe'){for(i=0;i<11;i++){bx=i*90;h=80+(i*31)%150;ctx.fillStyle=i%2?'#8193aa':'#70849e';ctx.fillRect(bx,390-h,72,h)}ctx.fillStyle='#4a5669';ctx.fillRect(0,390,960,150)}
 else if(type==='beach'){ctx.fillStyle='#efd18c';ctx.fillRect(0,355,960,185);ctx.fillStyle='#5fc5e5';ctx.fillRect(0,310,960,45)}
 else if(type==='forest'){ctx.fillStyle='#70b579';ctx.fillRect(0,320,960,220);for(i=0;i<9;i++)tree(55+i*110,360,.9)}
 else if(type==='mountain'){poly([[0,335],[180,130],[360,335]],'#71889e');poly([[240,335],[510,105],[800,335]],'#627b93');ctx.fillStyle='#6da56c';ctx.fillRect(0,335,960,205)}
 else {ctx.fillStyle='#75b66e';ctx.fillRect(0,330,960,210);for(i=0;i<6;i++)tree(70+i*170,360,.8)}
 if(type==='home'||type==='bedroom'){ctx.fillStyle='#d8c1a1';ctx.fillRect(330,185,300,190);ctx.fillStyle='#9c5b42';ctx.fillRect(310,160,340,35);ctx.fillStyle='#82503a';ctx.fillRect(455,270,55,105);ctx.fillStyle='#8ed5e9';ctx.fillRect(375,220,55,55);ctx.fillRect(530,220,55,55)}
 if(type==='school'){ctx.fillStyle='#e1ad69';ctx.fillRect(190,185,580,225);ctx.fillStyle='#a84d55';ctx.fillRect(165,155,630,45);for(i=0;i<5;i++){ctx.fillStyle='#8bd1e8';ctx.fillRect(245+i*100,235,60,55)}}
 if(type==='shrine'){ctx.fillStyle='#c74b4f';ctx.fillRect(300,185,360,190);poly([[250,190],[710,190],[650,135],[310,135]],'#96333d');ctx.fillStyle='#f0d38c';ctx.fillRect(455,270,50,105)}
 if(type==='festival'){for(i=0;i<7;i++){ctx.fillStyle=i%2?'#58d2e8':'#f15d78';ctx.fillRect(80+i*125,145,52,235)}}
 if(type==='rain'){for(i=0;i<90;i++){ctx.strokeStyle='#c0e0ff';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo((i*83)%960,(i*41)%390);ctx.lineTo((i*83)%960-7,(i*41)%390+18);ctx.stroke()}}
}

function human(ch,px,ground,phase,mood,action,scale,flip){
 var d=chars[ch],s=scale||1,run=action==='run'||action==='walk',stride=run?Math.sin(phase*(action==='run'?13:7))*22*s:0,bob=run?Math.sin(phase*10)*3*s:0,y=ground-160*s+bob;
 ctx.save();ctx.translate(px,0);ctx.scale(flip||1,1);
 ellipse(0,ground+2,42*s,8*s,'#0003');
 seg([-11*s,y+105*s],[-11*s+stride,y+148*s],d.pants,12*s);seg([11*s,y+105*s],[11*s-stride,y+148*s],d.pants,12*s);
 seg([-11*s+stride,y+148*s],[-18*s+stride,y+150*s],d.skin,6*s);seg([11*s-stride,y+148*s],[18*s-stride,y+150*s],d.skin,6*s);
 ctx.fillStyle=d.shirt;ctx.fillRect(-29*s,y+58*s,58*s,55*s);
 var arm=run?Math.sin(phase*10)*18*s:0;
 seg([-25*s,y+68*s],[-37*s,y+105*s+arm],d.skin,9*s);seg([25*s,y+68*s],[37*s,y+105*s-arm],d.skin,9*s);
 if(action==='wave')seg([30*s,y+72*s],[50*s,y+35*s],d.skin,9*s);
 if(action==='point')seg([28*s,y+73*s],[58*s,y+58*s],d.skin,8*s);
 ctx.fillStyle=d.skin;ctx.fillRect(-8*s,y+48*s,16*s,18*s);circle(0,y+30*s,38*s,d.skin);
 ctx.fillStyle=d.hair;ctx.beginPath();ctx.arc(0,y+25*s,40*s,Math.PI,Math.PI*2);ctx.lineTo(35*s,y+32*s);ctx.lineTo(20*s,y+2*s);ctx.lineTo(-20*s,y+2*s);ctx.closePath();ctx.fill();
 var blink=(Math.floor(phase*1.3)%8===0&&phase%1<.15);
 if(blink){seg([-15*s,y+31*s],[-7*s,y+31*s],'#202536',3*s);seg([7*s,y+31*s],[15*s,y+31*s],'#202536',3*s)}
 else{circle(-11*s,y+31*s,4*s,'#26304a');circle(11*s,y+31*s,4*s,'#26304a');circle(-10*s,y+29*s,1.5*s,'#fff');circle(12*s,y+29*s,1.5*s,'#fff')}
 ctx.strokeStyle='#713d4b';ctx.lineWidth=2*s;ctx.beginPath();ctx.arc(0,y+48*s,7*s,0,Math.PI);ctx.stroke();
 if(mood==='sad'){ctx.beginPath();ctx.arc(0,y+53*s,7*s,Math.PI,Math.PI*2);ctx.stroke()}
 if(mood==='surprised')ellipse(0,y+49*s,5*s,7*s,'#713d4b');
 if(action==='talk'){ellipse(0,y+49*s,(4+Math.abs(Math.sin(phase*12))*5)*s,4*s,'#713d4b')}
 ctx.restore();
}
function animal(ch,px,ground,phase,action,scale,flip){
 var d=chars[ch],s=scale||1,run=action==='run'||action==='walk',bob=run?Math.sin(phase*12)*4*s:0,y=ground-62*s+bob,stride=run?Math.sin(phase*12)*18*s:0;
 ctx.save();ctx.translate(px,0);ctx.scale(flip||1,1);ellipse(0,ground+2,48*s,8*s,'#0003');
 seg([-25*s,y+34*s],[-34*s-stride*.3,y+67*s],d.fur,9*s);seg([25*s,y+34*s],[34*s+stride*.3,y+67*s],d.fur,9*s);
 ellipse(0,y+24*s,58*s,36*s,d.fur);seg([-48*s,y+24*s],[-72*s,y-5*s],d.fur,9*s);circle(48*s,y-2*s,31*s,d.fur);
 poly([[28*s,y-20*s],[33*s,y-49*s],[50*s,y-25*s]],d.fur);poly([[63*s,y-25*s],[78*s,y-49*s],[80*s,y-10*s]],d.fur);
 circle(39*s,y-5*s,4*s,'#202536');circle(59*s,y-5*s,4*s,'#202536');circle(38*s,y-7*s,1.5*s,'#fff');circle(58*s,y-7*s,1.5*s,'#fff');ellipse(50*s,y+9*s,5*s,4*s,'#302333');
 if(action==='talk')ellipse(50*s,y+16*s,6*s,5*s,'#713d4b');
 ctx.restore();
}
function special(ch,px,ground,phase){
 var d=chars[ch],s=1,y=ground-150;
 ellipse(px,ground,42,8,'#0003');
 if(d.type==='robot'){ctx.fillStyle='#c5d1e2';ctx.fillRect(px-30,y+45,60,70);ctx.fillStyle='#aebbd0';ctx.fillRect(px-32,y,64,55);circle(px-12,y+25,5,'#62d7ff');circle(px+12,y+25,5,'#62d7ff');seg([px-27,y+65],[px-50,y+100],'#aebbd0',10);seg([px+27,y+65],[px+50,y+100],'#aebbd0',10);seg([px-16,y+115],[px-22,y+145],'#aebbd0',11);seg([px+16,y+115],[px+22,y+145],'#aebbd0',11)}
 else{circle(px,y+35,40,'#8ad4ba');circle(px,y,42,'#8ad4ba');ellipse(px-14,y,9,15,'#30285b');ellipse(px+14,y,9,15,'#30285b');ctx.fillStyle='#7056e8';ctx.beginPath();ctx.arc(px,y-3,40,Math.PI,Math.PI*2);ctx.fill();seg([px-14,y+88],[px-25,y+145],'#8ad4ba',9);seg([px+14,y+88],[px+25,y+145],'#8ad4ba',9)}
}
function drawChar(ch,px,ground,phase,mood,action,scale,flip){if(!ch||ch==='none')return;var d=chars[ch];if(d.type==='human')human(ch,px,ground,phase,mood,action,scale,flip);else if(d.type==='animal')animal(ch,px,ground,phase,action,scale,flip);else special(ch,px,ground,phase)}

function interpret(text,prev){
 var q=text.toLowerCase(),actor=prev?prev.actor:'girl',second='none',action='idle',bg=prev?prev.background:'park',mood='neutral';
 if(/cachorro|cão/.test(q))actor='dog';else if(/gato/.test(q))actor='cat';else if(/raposa/.test(q))actor='fox';else if(/lobo/.test(q))actor='wolf';else if(/robô|robo/.test(q))actor='robot';else if(/alien/.test(q))actor='alien';else if(/menino|garoto/.test(q))actor='boy';else if(/menina|garota/.test(q))actor='girl';
 if(/correu|correr/.test(q))action='run';else if(/caminhou|caminha|andou|andar/.test(q))action='walk';else if(/acenou|acena|acenar/.test(q))action='wave';else if(/pulou|pula|pular/.test(q))action='jump';else if(/dançou|danca|dança/.test(q))action='dance';else if(/disse|falou|fala|convers/.test(q))action='talk';else if(/apontou|aponta/.test(q))action='point';else if(/pensou|pensa/.test(q))action='think';
 if(/cachorro|cão/.test(q)&&actor!=='dog')second='dog';else if(/gato/.test(q)&&actor!=='cat')second='cat';else if(/menina|garota/.test(q)&&actor!=='girl')second='girl';else if(/menino|garoto/.test(q)&&actor!=='boy')second='boy';
 if(/casa/.test(q))bg='home';else if(/quarto/.test(q))bg='bedroom';else if(/parque/.test(q))bg='park';else if(/cidade|rua/.test(q))bg='city';else if(/escola/.test(q))bg='school';else if(/praia|mar/.test(q))bg='beach';else if(/floresta/.test(q))bg='forest';else if(/montanha/.test(q))bg='mountain';else if(/chuva|chove/.test(q))bg='rain';else if(/noite/.test(q))bg='night';else if(/entardecer|por do sol|pôr do sol/.test(q))bg='sunset';else if(/templo/.test(q))bg='shrine';else if(/espaço|espaco/.test(q))bg='space';else if(/futur|neon|cyber/.test(q))bg='cyber';else if(/festival|festa/.test(q))bg='festival';else if(/café|cafe/.test(q))bg='cafe';
 if(/triste|chorou/.test(q))mood='sad';else if(/surpres/.test(q))mood='surprised';else if(/bravo|raiva/.test(q))mood='angry';else if(/feliz|alegre|brinc/.test(q))mood='happy';
 return {text:text,actor:actor,second:second,background:bg,action:action,mood:mood,camera:action==='run'?'follow':action==='talk'?'medium':'wide',duration:Math.max(3,Math.min(8,3+text.length/40))};
}
function generate(){var arr=$('story').value.split(/[\n.!?]+/),out=[],prev=null;for(var i=0;i<arr.length;i++){var t=arr[i].trim();if(t){var s=interpret(t,prev);out.push(s);prev=s}}scenes=out.length?out:[interpret('Uma garota caminhou no parque.',null)];cur=0;elapsed=0;render();draw(0)}
function demo(){scenes=[
{text:'Uma garota caminhava ao entardecer.',actor:'girl',second:'none',background:'sunset',action:'walk',mood:'happy',camera:'wide',duration:4},
{text:'Ela encontrou um cachorro.',actor:'girl',second:'dog',background:'park',action:'idle',mood:'surprised',camera:'medium',duration:4},
{text:'O cachorro correu até a garota.',actor:'dog',second:'girl',background:'park',action:'run',mood:'happy',camera:'follow',duration:5},
{text:'A garota acenou para ele.',actor:'girl',second:'dog',background:'park',action:'wave',mood:'happy',camera:'close',duration:4},
{text:'Começou a chover.',actor:'girl',second:'dog',background:'rain',action:'idle',mood:'surprised',camera:'wide',duration:4},
{text:'Os dois correram para casa.',actor:'girl',second:'dog',background:'rain',action:'run',mood:'happy',camera:'follow',duration:5}
];cur=0;elapsed=0;render();draw(0)}
function positions(s,p){var a=430,b=650;if(s.action==='run'){if(s.actor==='dog'||s.actor==='cat'||s.actor==='fox'||s.actor==='wolf'){a=850-420*p;b=430}else{a=300+130*p;b=650}}else if(s.action==='walk')a=330+130*p;return[a,b]}
function draw(p){
 if(!scenes.length)return;var s=scenes[cur],pr=Math.max(0,Math.min(1,p)),phase=Date.now()/1000;
 background(s.background);
 var pos=positions(s,pr),a=pos[0],b=pos[1],zoom=s.camera==='close'?1.2:s.camera==='medium'?1.08:1;
 ctx.save();ctx.translate(480,270);ctx.scale(zoom,zoom);ctx.translate(-480, -270);
 var ground=390,jump=s.action==='jump'?-Math.abs(Math.sin(pr*Math.PI))*70:0;
 if(s.second!=='none')drawChar(s.second,b,ground,phase+1,s.mood,'idle',.92,b>a?1:-1);
